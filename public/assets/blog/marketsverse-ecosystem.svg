    <line x1="600" y1="225" x2="600" y2="75"/>
    <line x1="667" y1="257" x2="798" y2="144"/>
    <line x1="690" y1="315" x2="840" y2="315"/>
    <line x1="667" y1="373" x2="798" y2="486"/>
    <line x1="600" y1="405" x2="600" y2="555"/>
    <line x1="533" y1="373" x2="402" y2="486"/>
    <line x1="510" y1="315" x2="360" y2="315"/>
    <line x1="533" y1="257" x2="402" y2="144"/>
