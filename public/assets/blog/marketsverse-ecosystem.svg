<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg11" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080f1c"/>
      <stop offset="0.5" stop-color="#0b1525"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="35%">
      <stop offset="0" stop-color="#c9a227" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="edgeGlow" cx="50%" cy="50%" r="80%">
      <stop offset="0" stop-color="#1a3060" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#080f1c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg11)"/>
  <rect width="1200" height="630" fill="url(#edgeGlow)"/>
  <rect width="1200" height="630" fill="url(#coreGlow)"/>

  <!-- Background infrastructure grid -->
  <g stroke="#c9a227" stroke-width="0.4" opacity="0.05">
    <line x1="0" y1="105" x2="1200" y2="105"/><line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Orbit rings -->
