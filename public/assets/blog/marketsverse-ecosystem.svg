  <circle cx="840" cy="315" r="42" fill="#0c1a2e"/>
  <circle cx="840" cy="315" r="42" fill="none" stroke="#c9a227" stroke-width="1.2"/>
  <text x="840" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#c9a227" opacity="0.7">Finance</text>
  <text x="840" y="324" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#c9a227" opacity="0.7">&amp; Fintech</text>

  <circle cx="798" cy="486" r="42" fill="#0c1a2e"/>
  <circle cx="798" cy="486" r="42" fill="none" stroke="#c9a227" stroke-width="1.2"/>
  <text x="798" y="481" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#c9a227" opacity="0.7">Creative</text>
  <text x="798" y="495" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#c9a227" opacity="0.7">Economy</text>

  <circle cx="600" cy="555" r="42" fill="#0c1a2e"/>
  <circle cx="600" cy="555" r="42" fill="none" stroke="#c9a227" stroke-width="1.2"/>
  <text x="600" y="550" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#c9a227" opacity="0.7">Social</text>
  <text x="600" y="564" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#c9a227" opacity="0.7">Commerce</text>

  <circle cx="402" cy="486" r="42" fill="#0c1a2e"/>
  <circle cx="402" cy="486" r="42" fill="none" stroke="#c9a227" stroke-width="1.2"/>
  <text x="402" y="481" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#c9a227" opacity="0.7">AgriTech</text>
  <text x="402" y="495" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#c9a227" opacity="0.7">&amp; Food</text>

  <circle cx="360" cy="315" r="42" fill="#0c1a2e"/>
  <circle cx="360" cy="315" r="42" fill="none" stroke="#c9a227" stroke-width="1.2"/>
  <text x="360" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#c9a227" opacity="0.7">Smart</text>
  <text x="360" y="324" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#c9a227" opacity="0.7">Mobility</text>

  <circle cx="402" cy="144" r="42" fill="#0c1a2e"/>
  <circle cx="402" cy="144" r="42" fill="none" stroke="#c9a227" stroke-width="1.2"/>
  <text x="402" y="139" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#c9a227" opacity="0.7">B2B</text>
  <text x="402" y="153" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#c9a227" opacity="0.7">Trade</text>

