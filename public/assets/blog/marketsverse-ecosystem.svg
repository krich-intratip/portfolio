    <line x1="798" y1="144" x2="840" y2="315" stroke-dasharray="4,4" opacity="0.1"/>
    <line x1="840" y1="315" x2="798" y2="486" stroke-dasharray="4,4" opacity="0.1"/>
    <line x1="798" y1="486" x2="600" y2="555" stroke-dasharray="4,4" opacity="0.1"/>
