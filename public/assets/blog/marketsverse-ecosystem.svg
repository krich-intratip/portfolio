  <circle cx="600" cy="315" r="160" fill="none" stroke="#c9a227" stroke-width="0.6" opacity="0.1" stroke-dasharray="5,5"/>
  <circle cx="600" cy="315" r="90" fill="none" stroke="#c9a227" stroke-width="0.6" opacity="0.15"/>

