    <circle cx="600" cy="195" r="3"/>
    <circle cx="699" cy="231" r="3"/>
    <circle cx="765" cy="315" r="3"/>
    <circle cx="699" cy="399" r="3"/>
    <circle cx="600" cy="435" r="3"/>
    <circle cx="501" cy="399" r="3"/>
    <circle cx="435" cy="315" r="3"/>
    <circle cx="501" cy="231" r="3"/>
  </g>

  <!-- Category pill -->
  <rect x="40" y="22" width="175" height="30" rx="15" fill="#c9a227" opacity="0.1"/>
  <rect x="40" y="22" width="175" height="30" rx="15" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.35"/>
  <text x="127" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#c9a227" opacity="0.8" letter-spacing="2">ECOSYSTEM</text>

  <!-- Bottom bar -->
  <rect x="0" y="592" width="1200" height="38" fill="#070b11" opacity="0.9"/>
  <line x1="0" y1="592" x2="1200" y2="592" stroke="#c9a227" stroke-width="0.8" opacity="0.3"/>
  <text x="60" y="614" font-family="Georgia, serif" font-size="16" fill="#c9a227" opacity="0.8">Marketsverse · Niche Market Ecosystem · Digital Era</text>
  <text x="1140" y="614" text-anchor="end" font-family="Georgia, serif" font-size="11" fill="#c9a227" opacity="0.45">Hub-and-Spoke</text>
