  <polygon points="600,255 652,285 652,345 600,375 548,345 548,285" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.3"/>
  <text x="600" y="308" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#c9a227" opacity="0.9" letter-spacing="1">MARKETS</text>
  <text x="600" y="328" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#c9a227" opacity="0.9" letter-spacing="1">VERSE</text>

