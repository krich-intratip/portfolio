    <rect x="28" y="158" width="14" height="86" fill="#1a3848"/>
    <rect x="44" y="165" width="18" height="79" fill="#38200a"/>
    <rect x="64" y="160" width="12" height="84" fill="#1a4a30"/>
    <rect x="78" y="155" width="16" height="89" fill="#2a1838"/>
    <rect x="96" y="162" width="14" height="82" fill="#1e3850"/>
    <rect x="112" y="158" width="15" height="86" fill="#402215"/>
    <rect x="129" y="163" width="16" height="81" fill="#1a3040"/>
