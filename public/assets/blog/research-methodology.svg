  <!-- Researcher desk — center -->
  <!-- Desk surface -->
  <rect x="280" y="430" width="640" height="30" rx="3" fill="#0e1e34"/>
  <rect x="280" y="460" width="640" height="40" rx="2" fill="#0c1a2c"/>
  <!-- Desk legs -->
  <rect x="300" y="460" width="16" height="40" fill="#0a1520"/>
  <rect x="888" y="460" width="16" height="40" fill="#0a1520"/>

  <!-- Laptop on desk -->
  <rect x="460" y="390" width="140" height="92" rx="3" fill="#0c1a2c"/>
  <rect x="462" y="392" width="136" height="80" rx="2" fill="#0e2040"/>
  <!-- Screen content — data visualization -->
  <g opacity="0.5">
    <!-- Scatter plot -->
    <circle cx="490" cy="420" r="3" fill="#c9a227"/>
    <circle cx="510" cy="410" r="3" fill="#c9a227"/>
    <circle cx="530" cy="430" r="3" fill="#c9a227"/>
    <circle cx="550" cy="415" r="3" fill="#c9a227"/>
    <circle cx="570" cy="400" r="3" fill="#c9a227"/>
    <!-- Trend line -->
    <line x1="480" y1="435" x2="585" y2="395" stroke="#c9a227" stroke-width="1.2"/>
    <!-- Axis lines -->
    <line x1="475" y1="397" x2="475" y2="462" stroke="#c9a227" stroke-width="0.8"/>
    <line x1="475" y1="462" x2="588" y2="462" stroke="#c9a227" stroke-width="0.8"/>
  </g>

  <!-- Papers/documents stacked on desk -->
  <g opacity="0.35">
    <rect x="650" y="418" width="80" height="60" rx="2" fill="#0e2040" stroke="#c9a227" stroke-width="0.8"/>
    <rect x="658" y="412" width="80" height="60" rx="2" fill="#0c1a30" stroke="#c9a227" stroke-width="0.8"/>
    <rect x="666" y="406" width="80" height="60" rx="2" fill="#0d1e38" stroke="#c9a227" stroke-width="0.8"/>
    <!-- Lines on top paper -->
    <line x1="676" y1="420" x2="736" y2="420" stroke="#c9a227" stroke-width="0.8"/>
    <line x1="676" y1="430" x2="730" y2="430" stroke="#c9a227" stroke-width="0.8"/>
    <line x1="676" y1="440" x2="735" y2="440" stroke="#c9a227" stroke-width="0.8"/>
  </g>

  <!-- Researcher silhouette -->
  <g transform="translate(530, 395)">
    <circle r="26" fill="#0d1828" cy="-55"/>
    <ellipse cx="0" cy="15" rx="36" ry="50" fill="#0d1828"/>
  </g>

  <!-- SEM path diagram — floating right -->
  <g transform="translate(820, 200)" opacity="0.55">
    <!-- Latent variables (circles) -->
    <circle cx="-120" cy="-60" r="38" fill="#0d1e34" stroke="#c9a227" stroke-width="1"/>
    <circle cx="-120" cy="60" r="38" fill="#0d1e34" stroke="#c9a227" stroke-width="1"/>
    <circle cx="60" cy="0" r="45" fill="#0d1e34" stroke="#c9a227" stroke-width="1.5"/>
    <circle cx="200" cy="0" r="38" fill="#0d1e34" stroke="#c9a227" stroke-width="1"/>
    <!-- Path arrows -->
    <path d="M-82,-55 L15,-8" fill="none" stroke="#c9a227" stroke-width="1.2"/>
    <path d="M-82,55 L15,8" fill="none" stroke="#c9a227" stroke-width="1.2"/>
    <path d="M105,0 L162,0" fill="none" stroke="#c9a227" stroke-width="1.2"/>
    <!-- Arrow heads -->
    <polygon points="15,-8 5,-14 5,-2" fill="#c9a227"/>
    <polygon points="15,8 5,2 5,14" fill="#c9a227"/>
    <polygon points="162,0 152,-6 152,6" fill="#c9a227"/>
    <!-- Labels -->
    <text x="-120" y="-56" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#c9a227" opacity="0.7">Factor A</text>
    <text x="-120" y="64" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#c9a227" opacity="0.7">Factor B</text>
    <text x="60" y="4" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#c9a227" opacity="0.7">Construct</text>
    <text x="200" y="4" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#c9a227" opacity="0.7">Outcome</text>
    <!-- Correlation arc -->
    <path d="M-158,-42 Q-210,0 -158,42" fill="none" stroke="#c9a227" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
    <polygon points="-158,42 -164,30 -152,34" fill="#c9a227" opacity="0.6"/>
  </g>

  <!-- Top bar label -->
  <rect x="58" y="46" width="200" height="30" rx="15" fill="#c9a227" opacity="0.1"/>
  <rect x="58" y="46" width="200" height="30" rx="15" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.35"/>
  <text x="158" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#c9a227" opacity="0.8" letter-spacing="2">RESEARCH METHOD</text>

  <!-- Bottom bar -->
  <rect x="0" y="555" width="1200" height="75" fill="#070b11" opacity="0.9"/>
  <line x1="0" y1="555" x2="1200" y2="555" stroke="#c9a227" stroke-width="0.8" opacity="0.3"/>
  <text x="60" y="598" font-family="Georgia, serif" font-size="19" fill="#c9a227" opacity="0.8">Research Methodology · SEM · Evidence-Based Decision Making</text>
  <text x="1140" y="598" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#c9a227" opacity="0.45">Grounded Theory</text>
</svg>
