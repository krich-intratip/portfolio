    <line x1="980" y1="250" x2="1200" y2="250"/>
    <line x1="980" y1="355" x2="1200" y2="355"/>
    <line x1="980" y1="460" x2="1200" y2="460"/>
  </g>
  <g opacity="0.5">
    <rect x="990" y="58" width="14" height="82" fill="#1a4060"/>
    <rect x="1006" y="62" width="16" height="78" fill="#2a3050"/>
    <rect x="1024" y="55" width="12" height="85" fill="#1a5040"/>
    <rect x="1038" y="60" width="15" height="80" fill="#402010"/>
    <rect x="1055" y="57" width="13" height="83" fill="#1a3050"/>
    <rect x="1070" y="52" width="16" height="88" fill="#30201a"/>
    <rect x="1088" y="60" width="12" height="80" fill="#1a4530"/>
    <rect x="1102" y="56" width="14" height="84" fill="#2a1a40"/>
    <rect x="1118" y="62" width="16" height="78" fill="#1a3560"/>
    <rect x="1136" y="55" width="13" height="85" fill="#402518"/>
    <rect x="1151" y="60" width="15" height="80" fill="#1a4020"/>
    <rect x="1168" y="57" width="14" height="83" fill="#253050"/>
    <rect x="1184" y="60" width="14" height="80" fill="#1a3040"/>
    <rect x="990" y="58" width="2" height="82" fill="#c9a227" opacity="0.2"/>
    <rect x="1088" y="60" width="2" height="80" fill="#c9a227" opacity="0.25"/>
