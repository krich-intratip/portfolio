    <rect x="10" y="60" width="2" height="80" fill="#c9a227" opacity="0.25"/>
    <rect x="90" y="52" width="2" height="88" fill="#c9a227" opacity="0.2"/>
    <rect x="156" y="55" width="2" height="85" fill="#c9a227" opacity="0.25"/>
