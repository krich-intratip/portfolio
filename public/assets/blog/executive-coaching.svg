<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1220"/>
      <stop offset="0.5" stop-color="#0e1a30"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <radialGradient id="tableGlow" cx="50%" cy="70%" r="35%">
      <stop offset="0" stop-color="#c9a227" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="windowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1e3a"/>
      <stop offset="1" stop-color="#08101e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg3)"/>
  <rect width="1200" height="630" fill="url(#tableGlow)"/>

  <!-- Floor -->
  <rect x="0" y="490" width="1200" height="140" fill="#080e18"/>
  <line x1="0" y1="490" x2="1200" y2="490" stroke="#18283e" stroke-width="1"/>

  <!-- Floor-to-ceiling windows — left panel -->
  <rect x="60" y="40" width="200" height="450" rx="2" fill="url(#windowGrad)"/>
  <rect x="60" y="40" width="200" height="450" rx="2" fill="none" stroke="#1e3050" stroke-width="2"/>
  <!-- Window frame dividers -->
  <line x1="160" y1="40" x2="160" y2="490" stroke="#1e3050" stroke-width="1.5"/>
  <line x1="60" y1="265" x2="260" y2="265" stroke="#1e3050" stroke-width="1"/>

  <!-- Floor-to-ceiling windows — right panel -->
  <rect x="940" y="40" width="200" height="450" rx="2" fill="url(#windowGrad)"/>
  <rect x="940" y="40" width="200" height="450" rx="2" fill="none" stroke="#1e3050" stroke-width="2"/>
  <line x1="1040" y1="40" x2="1040" y2="490" stroke="#1e3050" stroke-width="1.5"/>
  <line x1="940" y1="265" x2="1140" y2="265" stroke="#1e3050" stroke-width="1"/>

  <!-- Bangkok city lights through windows — left -->
  <g opacity="0.55">
    <!-- Building lights left window -->
    <rect x="70" y="320" width="6" height="90" fill="#1a3860"/>
    <rect x="82" y="290" width="6" height="120" fill="#1e4070"/>
    <rect x="94" y="340" width="6" height="70" fill="#162e50"/>
    <rect x="106" y="280" width="8" height="130" fill="#1e4070"/>
    <rect x="120" y="310" width="6" height="100" fill="#1a3860"/>
    <rect x="132" y="350" width="6" height="60" fill="#162e50"/>
    <rect x="144" y="295" width="6" height="115" fill="#1e4070"/>
    <rect x="158" y="325" width="6" height="85" fill="#1a3860"/>
    <rect x="172" y="300" width="6" height="110" fill="#1e4070"/>
    <rect x="185" y="355" width="6" height="55" fill="#162e50"/>
    <rect x="197" y="285" width="6" height="125" fill="#1a3860"/>
    <rect x="210" y="330" width="6" height="80" fill="#1e4070"/>
    <rect x="222" y="370" width="6" height="40" fill="#162e50"/>
    <rect x="234" y="300" width="6" height="110" fill="#1a3860"/>
    <!-- Lit windows in buildings -->
    <g fill="#c9a227" opacity="0.35">
      <rect x="83" y="300" width="4" height="5"/><rect x="83" y="312" width="4" height="5"/>
      <rect x="108" y="288" width="5" height="6"/><rect x="108" y="300" width="5" height="6"/>
      <rect x="146" y="304" width="4" height="5"/>
      <rect x="173" y="310" width="4" height="5"/><rect x="173" y="322" width="4" height="5"/>
      <rect x="198" y="293" width="4" height="5"/><rect x="198" y="305" width="4" height="5"/>
    </g>
  </g>

  <!-- Bangkok city lights through windows — right -->
  <g opacity="0.55">
    <rect x="950" y="320" width="6" height="90" fill="#1a3860"/>
    <rect x="962" y="285" width="6" height="125" fill="#1e4070"/>
    <rect x="974" y="340" width="6" height="70" fill="#162e50"/>
    <rect x="986" y="295" width="8" height="115" fill="#1e4070"/>
    <rect x="1000" y="310" width="6" height="100" fill="#1a3860"/>
    <rect x="1012" y="360" width="6" height="50" fill="#162e50"/>
    <rect x="1026" y="290" width="6" height="120" fill="#1e4070"/>
    <rect x="1040" y="325" width="6" height="85" fill="#1a3860"/>
    <rect x="1054" y="305" width="6" height="105" fill="#1e4070"/>
    <rect x="1068" y="350" width="6" height="60" fill="#162e50"/>
    <rect x="1082" y="280" width="6" height="130" fill="#1a3860"/>
    <rect x="1096" y="330" width="6" height="80" fill="#1e4070"/>
    <rect x="1110" y="370" width="6" height="40" fill="#162e50"/>
    <rect x="1124" y="295" width="6" height="115" fill="#1a3860"/>
    <g fill="#c9a227" opacity="0.35">
      <rect x="963" y="295" width="4" height="5"/><rect x="963" y="307" width="4" height="5"/>
      <rect x="987" y="304" width="5" height="6"/>
      <rect x="1027" y="298" width="4" height="5"/><rect x="1027" y="310" width="4" height="5"/>
      <rect x="1083" y="290" width="4" height="5"/>
      <rect x="1097" y="340" width="4" height="5"/>
    </g>
  </g>

  <!-- Room ceiling -->
  <rect x="260" y="0" width="680" height="40" fill="#0c1a2e"/>
  <!-- Ceiling light strips -->
  <rect x="320" y="30" width="200" height="4" rx="2" fill="#c9a227" opacity="0.15"/>
  <rect x="680" y="30" width="200" height="4" rx="2" fill="#c9a227" opacity="0.15"/>

  <!-- Conference table — oval top view -->
  <ellipse cx="600" cy="400" rx="280" ry="80" fill="#0e1e34"/>
  <ellipse cx="600" cy="400" rx="280" ry="80" fill="none" stroke="#1e3050" stroke-width="2"/>
  <!-- Table surface reflection -->
  <ellipse cx="600" cy="390" rx="220" ry="55" fill="#c9a227" opacity="0.025"/>

  <!-- 5 executive silhouettes around table -->
  <!-- Person 1 — far left -->
  <g transform="translate(340,340)">
    <circle r="22" fill="#0d1a2e"/>
    <ellipse cx="0" cy="55" rx="28" ry="38" fill="#0d1a2e"/>
  </g>
  <!-- Person 2 — left-center -->
  <g transform="translate(460,310)">
    <circle r="24" fill="#0e1c30"/>
    <ellipse cx="0" cy="58" rx="30" ry="40" fill="#0e1c30"/>
  </g>
  <!-- Person 3 — center (coach / leader, slightly larger) -->
  <g transform="translate(600,290)">
    <circle r="28" fill="#102030"/>
    <ellipse cx="0" cy="64" rx="34" ry="44" fill="#102030"/>
    <!-- Gold accent collar/tie hint -->
    <line x1="-4" y1="36" x2="0" y2="60" stroke="#c9a227" stroke-width="1.5" opacity="0.5"/>
    <line x1="4" y1="36" x2="0" y2="60" stroke="#c9a227" stroke-width="1.5" opacity="0.5"/>
  </g>
  <!-- Person 4 — right-center -->
  <g transform="translate(740,310)">
    <circle r="24" fill="#0e1c30"/>
    <ellipse cx="0" cy="58" rx="30" ry="40" fill="#0e1c30"/>
  </g>
  <!-- Person 5 — far right -->
  <g transform="translate(860,340)">
    <circle r="22" fill="#0d1a2e"/>
    <ellipse cx="0" cy="55" rx="28" ry="38" fill="#0d1a2e"/>
  </g>

  <!-- Coaching arc connections from center person -->
  <g fill="none" stroke="#c9a227" opacity="0.35">
    <path d="M580,310 Q460,270 360,340" stroke-width="1.2" stroke-dasharray="5,4"/>
    <path d="M585,315 Q500,270 465,318" stroke-width="1" stroke-dasharray="4,3"/>
    <path d="M620,315 Q700,270 735,318" stroke-width="1" stroke-dasharray="4,3"/>
    <path d="M620,310 Q740,265 845,340" stroke-width="1.2" stroke-dasharray="5,4"/>
  </g>
  <!-- Lateral connection -->
  <path d="M340,350 Q600,260 860,350" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.15" stroke-dasharray="6,5"/>

  <!-- Notebooks/devices on table -->
  <g opacity="0.3">
    <rect x="360" y="390" width="50" height="32" rx="2" fill="none" stroke="#c9a227" stroke-width="1"/>
    <rect x="480" y="375" width="50" height="32" rx="2" fill="none" stroke="#c9a227" stroke-width="1"/>
    <rect x="570" y="365" width="60" height="36" rx="2" fill="#c9a227" opacity="0.1"/>
    <rect x="570" y="365" width="60" height="36" rx="2" fill="none" stroke="#c9a227" stroke-width="1.2"/>
    <rect x="670" y="375" width="50" height="32" rx="2" fill="none" stroke="#c9a227" stroke-width="1"/>
    <rect x="790" y="390" width="50" height="32" rx="2" fill="none" stroke="#c9a227" stroke-width="1"/>
  </g>

  <!-- Category pill -->
  <rect x="58" y="46" width="195" height="30" rx="15" fill="#c9a227" opacity="0.1"/>
  <rect x="58" y="46" width="195" height="30" rx="15" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.35"/>
  <text x="156" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#c9a227" opacity="0.8" letter-spacing="2">EXECUTIVE COACHING</text>

  <!-- Bottom bar -->
  <rect x="0" y="555" width="1200" height="75" fill="#070b11" opacity="0.9"/>
  <line x1="0" y1="555" x2="1200" y2="555" stroke="#c9a227" stroke-width="0.8" opacity="0.3"/>
  <text x="60" y="598" font-family="Georgia, serif" font-size="19" fill="#c9a227" opacity="0.8">Executive Coaching · Leadership Development · Bangkok</text>
  <text x="1140" y="598" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#c9a227" opacity="0.45">Enneagram · MBTI</text>
</svg>
