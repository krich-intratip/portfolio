<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1829"/>
      <stop offset="0.6" stop-color="#0f1e35"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="55%" r="45%">
      <stop offset="0" stop-color="#c9a227" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skyGlow" cx="50%" cy="20%" r="50%">
      <stop offset="0" stop-color="#1a3a6e" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0d1829" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg1)"/>
  <rect width="1200" height="630" fill="url(#skyGlow)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.35">
    <circle cx="80" cy="40" r="1"/><circle cx="180" cy="70" r="1.2"/><circle cx="310" cy="30" r="0.8"/>
    <circle cx="450" cy="55" r="1"/><circle cx="560" cy="25" r="1.2"/><circle cx="700" cy="45" r="0.8"/>
    <circle cx="820" cy="60" r="1"/><circle cx="950" cy="35" r="1.2"/><circle cx="1080" cy="50" r="0.8"/>
    <circle cx="140" cy="100" r="0.8"/><circle cx="380" cy="80" r="1"/><circle cx="640" cy="90" r="0.8"/>
    <circle cx="880" cy="75" r="1"/><circle cx="1100" cy="85" r="0.8"/>
  </g>

  <!-- Ground plane -->
  <rect x="0" y="540" width="1200" height="90" fill="#080c14"/>
  <!-- Ground reflection -->
  <rect x="0" y="538" width="1200" height="4" fill="#c9a227" opacity="0.08"/>

  <!-- Parliament building — main body -->
  <g transform="translate(600,540)">
    <!-- Foundation steps -->
    <rect x="-380" y="-18" width="760" height="18" fill="#0e1a2e"/>
    <rect x="-360" y="-34" width="720" height="16" fill="#111f34"/>
    <rect x="-340" y="-48" width="680" height="14" fill="#132540"/>

    <!-- Side wings -->
    <rect x="-340" y="-180" width="130" height="132" fill="#0e1828"/>
    <rect x="210" y="-180" width="130" height="132" fill="#0e1828"/>
    <!-- Wing windows lit -->
    <g fill="#c9a227" opacity="0.2">
      <rect x="-320" y="-160" width="22" height="32" rx="2"/>
      <rect x="-288" y="-160" width="22" height="32" rx="2"/>
      <rect x="-256" y="-160" width="22" height="32" rx="2"/>
      <rect x="-320" y="-118" width="22" height="32" rx="2"/>
      <rect x="-288" y="-118" width="22" height="32" rx="2"/>
      <rect x="230" y="-160" width="22" height="32" rx="2"/>
      <rect x="262" y="-160" width="22" height="32" rx="2"/>
      <rect x="294" y="-160" width="22" height="32" rx="2"/>
      <rect x="230" y="-118" width="22" height="32" rx="2"/>
      <rect x="262" y="-118" width="22" height="32" rx="2"/>
    </g>

    <!-- Main facade -->
    <rect x="-210" y="-310" width="420" height="262" fill="#0f1f36"/>
    <!-- Facade windows grid -->
    <g fill="#c9a227" opacity="0.18">
      <rect x="-188" y="-290" width="28" height="40" rx="2"/>
      <rect x="-148" y="-290" width="28" height="40" rx="2"/>
      <rect x="-108" y="-290" width="28" height="40" rx="2"/>
      <rect x="-68" y="-290" width="28" height="40" rx="2"/>
      <rect x="-28" y="-290" width="28" height="40" rx="2"/>
      <rect x="12" y="-290" width="28" height="40" rx="2"/>
      <rect x="52" y="-290" width="28" height="40" rx="2"/>
      <rect x="92" y="-290" width="28" height="40" rx="2"/>
      <rect x="132" y="-290" width="28" height="40" rx="2"/>
      <rect x="160" y="-290" width="28" height="40" rx="2"/>
      <rect x="-188" y="-238" width="28" height="40" rx="2"/>
      <rect x="-148" y="-238" width="28" height="40" rx="2"/>
      <rect x="-108" y="-238" width="28" height="40" rx="2"/>
      <rect x="92" y="-238" width="28" height="40" rx="2"/>
      <rect x="132" y="-238" width="28" height="40" rx="2"/>
      <rect x="160" y="-238" width="28" height="40" rx="2"/>
    </g>

    <!-- Columns row -->
    <g fill="#132845">
      <rect x="-195" y="-310" width="16" height="262"/>
      <rect x="-165" y="-310" width="16" height="262"/>
      <rect x="-135" y="-310" width="16" height="262"/>
      <rect x="-105" y="-310" width="16" height="262"/>
      <rect x="89" y="-310" width="16" height="262"/>
      <rect x="119" y="-310" width="16" height="262"/>
      <rect x="149" y="-310" width="16" height="262"/>
      <rect x="179" y="-310" width="16" height="262"/>
    </g>

    <!-- Pediment / cornice -->
    <rect x="-215" y="-318" width="430" height="12" fill="#1a3050"/>
    <polygon points="-215,-318 0,-390 215,-318" fill="#0e1e32"/>
    <polygon points="-195,-318 0,-370 195,-318" fill="#132845"/>
    <!-- Pediment accent line -->
    <polyline points="-210,-318 0,-385 210,-318" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.3"/>

    <!-- Dome base ring -->
    <rect x="-70" y="-410" width="140" height="20" fill="#0d1e38"/>
    <!-- Dome -->
    <ellipse cx="0" cy="-430" rx="68" ry="42" fill="#0e1f3a"/>
    <!-- Dome ribs -->
    <g stroke="#1a3050" stroke-width="1.5" fill="none">
      <path d="M0,-472 Q-30,-450 -60,-430"/>
      <path d="M0,-472 Q-15,-450 -25,-430"/>
      <path d="M0,-472 Q15,-450 25,-430"/>
      <path d="M0,-472 Q30,-450 60,-430"/>
    </g>
    <!-- Dome spire base -->
    <rect x="-6" y="-474" width="12" height="22" fill="#1a3050"/>
    <!-- Spire -->
    <line x1="0" y1="-474" x2="0" y2="-520" stroke="#c9a227" stroke-width="2" opacity="0.6"/>
    <polygon points="0,-528 -5,-514 5,-514" fill="#c9a227" opacity="0.7"/>

    <!-- Main entrance door -->
    <rect x="-40" y="-150" width="80" height="102" rx="6" fill="#0a1120"/>
    <rect x="-30" y="-145" width="26" height="68" rx="3" fill="#c9a227" opacity="0.1"/>
    <rect x="4" y="-145" width="26" height="68" rx="3" fill="#c9a227" opacity="0.1"/>
    <!-- Arch above door -->
    <path d="M-40,-148 Q0,-180 40,-148" fill="none" stroke="#1a3050" stroke-width="3"/>
  </g>

  <!-- AI neural network — floating above building -->
  <!-- Layer 1 nodes -->
  <g opacity="0.65">
    <circle cx="160" cy="160" r="6" fill="#c9a227"/>
    <circle cx="160" cy="220" r="6" fill="#c9a227"/>
    <circle cx="160" cy="280" r="6" fill="#c9a227"/>
    <!-- Layer 2 -->
    <circle cx="320" cy="140" r="7" fill="#c9a227"/>
    <circle cx="320" cy="200" r="7" fill="#c9a227"/>
    <circle cx="320" cy="260" r="7" fill="#c9a227"/>
    <circle cx="320" cy="320" r="7" fill="#c9a227"/>
    <!-- Layer 3 (output) -->
    <circle cx="480" cy="180" r="8" fill="#c9a227"/>
    <circle cx="480" cy="260" r="8" fill="#c9a227"/>
  </g>
  <g stroke="#c9a227" stroke-width="0.8" opacity="0.2" fill="none">
    <line x1="160" y1="160" x2="320" y2="140"/>
    <line x1="160" y1="160" x2="320" y2="200"/>
    <line x1="160" y1="160" x2="320" y2="260"/>
    <line x1="160" y1="220" x2="320" y2="140"/>
    <line x1="160" y1="220" x2="320" y2="200"/>
    <line x1="160" y1="220" x2="320" y2="260"/>
    <line x1="160" y1="220" x2="320" y2="320"/>
    <line x1="160" y1="280" x2="320" y2="200"/>
    <line x1="160" y1="280" x2="320" y2="260"/>
    <line x1="160" y1="280" x2="320" y2="320"/>
    <line x1="320" y1="140" x2="480" y2="180"/>
    <line x1="320" y1="200" x2="480" y2="180"/>
    <line x1="320" y1="200" x2="480" y2="260"/>
    <line x1="320" y1="260" x2="480" y2="180"/>
    <line x1="320" y1="260" x2="480" y2="260"/>
    <line x1="320" y1="320" x2="480" y2="260"/>
  </g>

  <!-- Right side: policy/governance framework boxes -->
  <g transform="translate(720, 120)" opacity="0.55">
    <!-- Framework pillars -->
    <rect x="0" y="0" width="110" height="60" rx="4" fill="none" stroke="#c9a227" stroke-width="1"/>
    <rect x="130" y="0" width="110" height="60" rx="4" fill="none" stroke="#c9a227" stroke-width="1"/>
    <rect x="260" y="0" width="110" height="60" rx="4" fill="none" stroke="#c9a227" stroke-width="1"/>
    <rect x="65" y="80" width="110" height="60" rx="4" fill="none" stroke="#c9a227" stroke-width="1"/>
    <rect x="195" y="80" width="110" height="60" rx="4" fill="none" stroke="#c9a227" stroke-width="1"/>
    <rect x="130" y="160" width="110" height="60" rx="4" fill="#c9a227" opacity="0.08"/>
    <rect x="130" y="160" width="110" height="60" rx="4" fill="none" stroke="#c9a227" stroke-width="1.5"/>
    <!-- Connecting lines down -->
    <line x1="55" y1="60" x2="120" y2="80" stroke="#c9a227" stroke-width="0.8" opacity="0.5"/>
    <line x1="185" y1="60" x2="120" y2="80" stroke="#c9a227" stroke-width="0.8" opacity="0.5"/>
    <line x1="185" y1="60" x2="250" y2="80" stroke="#c9a227" stroke-width="0.8" opacity="0.5"/>
    <line x1="315" y1="60" x2="250" y2="80" stroke="#c9a227" stroke-width="0.8" opacity="0.5"/>
    <line x1="120" y1="140" x2="185" y2="160" stroke="#c9a227" stroke-width="0.8" opacity="0.5"/>
    <line x1="250" y1="140" x2="185" y2="160" stroke="#c9a227" stroke-width="0.8" opacity="0.5"/>
    <!-- Small icons in boxes -->
    <text x="55" y="35" text-anchor="middle" font-family="Georgia" font-size="18" fill="#c9a227" opacity="0.6">⚖</text>
    <text x="185" y="35" text-anchor="middle" font-family="Georgia" font-size="18" fill="#c9a227" opacity="0.6">🔒</text>
    <text x="315" y="35" text-anchor="middle" font-family="Georgia" font-size="18" fill="#c9a227" opacity="0.6">◎</text>
    <text x="120" y="115" text-anchor="middle" font-family="Georgia" font-size="18" fill="#c9a227" opacity="0.6">◈</text>
    <text x="250" y="115" text-anchor="middle" font-family="Georgia" font-size="18" fill="#c9a227" opacity="0.6">◇</text>
    <text x="185" y="195" text-anchor="middle" font-family="Georgia" font-size="18" fill="#c9a227" opacity="0.8">◉</text>
    <!-- Label under final box -->
    <text x="185" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#c9a227" opacity="0.55" letter-spacing="1">TH-AICF</text>
  </g>

  <!-- Category pill -->
  <rect x="58" y="46" width="168" height="30" rx="15" fill="#c9a227" opacity="0.12"/>
  <rect x="58" y="46" width="168" height="30" rx="15" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.4"/>
  <text x="142" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#c9a227" opacity="0.85" letter-spacing="2">AI GOVERNANCE</text>

  <!-- Bottom bar -->
  <rect x="0" y="555" width="1200" height="75" fill="#070b11" opacity="0.85"/>
  <line x1="0" y1="555" x2="1200" y2="555" stroke="#c9a227" stroke-width="0.8" opacity="0.3"/>
  <text x="60" y="598" font-family="Georgia, serif" font-size="19" fill="#c9a227" opacity="0.8">National AI Competency Framework · Thailand 2026</text>
  <text x="1140" y="598" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#c9a227" opacity="0.45">TH-AICF</text>
</svg>
