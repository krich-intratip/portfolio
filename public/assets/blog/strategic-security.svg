<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#09111e"/>
      <stop offset="0.5" stop-color="#0c1828"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0" stop-color="#1a4a8a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0a0e17" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c9a227" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg2)"/>
  <rect width="1200" height="630" fill="url(#screenGlow)"/>
  <rect width="1200" height="630" fill="url(#goldGlow2)"/>

  <!-- Room floor -->
  <rect x="0" y="500" width="1200" height="130" fill="#08101a"/>
  <line x1="0" y1="500" x2="1200" y2="500" stroke="#1a2a40" stroke-width="1.5"/>

  <!-- Main wall display — large tactical map -->
  <rect x="120" y="60" width="700" height="400" rx="4" fill="#0a1628"/>
  <rect x="120" y="60" width="700" height="400" rx="4" fill="none" stroke="#1e3a60" stroke-width="2"/>
  <!-- Map grid -->
  <g stroke="#1e3a60" stroke-width="0.5" opacity="0.6">
    <line x1="120" y1="130" x2="820" y2="130"/>
    <line x1="120" y1="200" x2="820" y2="200"/>
    <line x1="120" y1="270" x2="820" y2="270"/>
    <line x1="120" y1="340" x2="820" y2="340"/>
    <line x1="120" y1="410" x2="820" y2="410"/>
    <line x1="220" y1="60" x2="220" y2="460"/>
    <line x1="320" y1="60" x2="320" y2="460"/>
    <line x1="420" y1="60" x2="420" y2="460"/>
    <line x1="520" y1="60" x2="520" y2="460"/>
    <line x1="620" y1="60" x2="620" y2="460"/>
    <line x1="720" y1="60" x2="720" y2="460"/>
  </g>
  <!-- Thailand outline approximation -->
  <path d="M350,120 L390,110 L430,130 L460,160 L480,200 L500,250 L490,300 L470,340 L440,370 L420,390 L400,380 L380,360 L360,330 L340,290 L330,250 L320,200 L330,160 Z" fill="none" stroke="#c9a227" stroke-width="1.5" opacity="0.5"/>
  <!-- Threat indicators on map -->
  <circle cx="280" cy="180" r="8" fill="none" stroke="#e05050" stroke-width="1.5" opacity="0.7"/>
  <circle cx="280" cy="180" r="16" fill="none" stroke="#e05050" stroke-width="0.8" opacity="0.4"/>
  <circle cx="280" cy="180" r="3" fill="#e05050" opacity="0.8"/>
  <circle cx="650" cy="200" r="8" fill="none" stroke="#e09020" stroke-width="1.5" opacity="0.6"/>
  <circle cx="650" cy="200" r="3" fill="#e09020" opacity="0.7"/>
  <!-- Friendly force markers -->
  <rect x="406" y="216" width="12" height="12" fill="none" stroke="#50c8e0" stroke-width="1.5" opacity="0.7"/>
  <rect x="456" y="266" width="12" height="12" fill="none" stroke="#50c8e0" stroke-width="1.5" opacity="0.7"/>
  <!-- Connection lines between units -->
  <g stroke="#50c8e0" stroke-width="0.8" opacity="0.3" stroke-dasharray="4,3">
    <line x1="412" y1="228" x2="462" y2="272"/>
    <line x1="412" y1="222" x2="286" y2="183"/>
  </g>

  <!-- Radar sweep circle -->
  <g transform="translate(720, 260)">
    <circle r="80" fill="none" stroke="#00c850" stroke-width="1" opacity="0.3"/>
    <circle r="55" fill="none" stroke="#00c850" stroke-width="0.8" opacity="0.2"/>
    <circle r="28" fill="none" stroke="#00c850" stroke-width="0.8" opacity="0.2"/>
    <path d="M0,0 L0,-80" stroke="#00c850" stroke-width="1.5" opacity="0.5" transform="rotate(-40)"/>
    <path d="M0,0 L0,-80 Q20,-60 0,0 Z" fill="#00c850" opacity="0.08" transform="rotate(-40)"/>
    <circle cx="30" cy="-50" r="3" fill="#00c850" opacity="0.6"/>
    <circle cx="-20" cy="35" r="3" fill="#00c850" opacity="0.4"/>
  </g>

  <!-- Side panels — right -->
  <rect x="850" y="60" width="320" height="160" rx="3" fill="#0a1628"/>
  <rect x="850" y="60" width="320" height="160" rx="3" fill="none" stroke="#1e3a60" stroke-width="1.5"/>
  <!-- Graph lines in right panel -->
  <g stroke="#c9a227" stroke-width="1.2" fill="none" opacity="0.5">
    <polyline points="870,190 910,160 950,170 990,140 1030,155 1070,130 1110,145 1150,120"/>
  </g>
  <circle cx="1150" cy="120" r="4" fill="#c9a227" opacity="0.7"/>

  <rect x="850" y="240" width="320" height="110" rx="3" fill="#0a1628"/>
  <rect x="850" y="240" width="320" height="110" rx="3" fill="none" stroke="#1e3a60" stroke-width="1.5"/>
  <!-- Cyber attack log lines -->
  <g fill="#c9a227" opacity="0.3">
    <rect x="870" y="260" width="80" height="3" rx="1"/>
    <rect x="870" y="275" width="140" height="3" rx="1"/>
    <rect x="870" y="290" width="110" height="3" rx="1"/>
    <rect x="870" y="305" width="160" height="3" rx="1"/>
    <rect x="870" y="320" width="90" height="3" rx="1"/>
  </g>
  <circle cx="1140" cy="275" r="5" fill="#e05050" opacity="0.6"/>
  <circle cx="1140" cy="305" r="5" fill="#c9a227" opacity="0.5"/>

  <!-- Workstations in front -->
  <g transform="translate(200, 510)">
    <!-- Desk 1 -->
    <rect x="-80" y="-20" width="160" height="15" rx="2" fill="#10203a"/>
    <rect x="-60" y="-50" width="55" height="35" rx="2" fill="#0e1e38"/>
    <rect x="5" y="-50" width="55" height="35" rx="2" fill="#0e1e38"/>
    <!-- Monitor glow -->
    <rect x="-58" y="-48" width="51" height="31" rx="1" fill="#1a3a6e" opacity="0.5"/>
    <rect x="7" y="-48" width="51" height="31" rx="1" fill="#1a3a6e" opacity="0.5"/>
    <!-- Operator silhouette -->
    <circle cx="0" cy="-80" r="14" fill="#0a1628"/>
    <rect x="-18" y="-65" width="36" height="45" rx="6" fill="#0a1628"/>
  </g>
  <g transform="translate(500, 510)">
    <rect x="-80" y="-20" width="160" height="15" rx="2" fill="#10203a"/>
    <rect x="-60" y="-50" width="55" height="35" rx="2" fill="#0e1e38"/>
    <rect x="5" y="-50" width="55" height="35" rx="2" fill="#0e1e38"/>
    <rect x="-58" y="-48" width="51" height="31" rx="1" fill="#1a3a6e" opacity="0.5"/>
    <rect x="7" y="-48" width="51" height="31" rx="1" fill="#c9a227" opacity="0.15"/>
    <circle cx="0" cy="-80" r="14" fill="#0a1628"/>
    <rect x="-18" y="-65" width="36" height="45" rx="6" fill="#0a1628"/>
  </g>

  <!-- Shield + lock icon top-right -->
  <g transform="translate(1080, 90)" opacity="0.4">
    <path d="M0,-45 L38,-28 L38,12 Q38,46 0,58 Q-38,46 -38,12 L-38,-28 Z" fill="none" stroke="#c9a227" stroke-width="1.5"/>
    <rect x="-10" y="-5" width="20" height="14" rx="3" fill="none" stroke="#c9a227" stroke-width="1.5"/>
    <path d="M0,-5 Q-7,-18 0,-22 Q7,-18 0,-5" fill="none" stroke="#c9a227" stroke-width="1.5"/>
  </g>

  <!-- Category pill -->
  <rect x="58" y="46" width="200" height="30" rx="15" fill="#c9a227" opacity="0.1"/>
  <rect x="58" y="46" width="200" height="30" rx="15" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.35"/>
  <text x="158" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#c9a227" opacity="0.8" letter-spacing="2">STRATEGIC SECURITY</text>

  <!-- Bottom bar -->
  <rect x="0" y="555" width="1200" height="75" fill="#070b11" opacity="0.9"/>
  <line x1="0" y1="555" x2="1200" y2="555" stroke="#c9a227" stroke-width="0.8" opacity="0.3"/>
  <text x="60" y="598" font-family="Georgia, serif" font-size="19" fill="#c9a227" opacity="0.8">Cyber Defense &amp; Strategic Security · Digital Age</text>
  <text x="1140" y="598" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#c9a227" opacity="0.45">NIST · Hybrid Warfare</text>
</svg>
