<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1522"/>
      <stop offset="0.5" stop-color="#0e1c30"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <radialGradient id="stageGlow9" cx="50%" cy="50%" r="40%">
      <stop offset="0" stop-color="#c9a227" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg9)"/>
  <rect width="1200" height="630" fill="url(#stageGlow9)"/>

  <!-- Tiered auditorium floor levels -->
  <g fill="#07101a">
    <rect x="0" y="570" width="1200" height="60"/><!-- floor level 4 -->
    <rect x="0" y="510" width="1200" height="65"/><!-- level 3 -->
    <rect x="0" y="455" width="1200" height="60"/><!-- level 2 -->
    <rect x="0" y="405" width="1200" height="55"/><!-- level 1 (front) -->
  </g>
  <!-- Tier edges -->
  <g stroke="#14243a" stroke-width="1.5">
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="455" x2="1200" y2="455"/>
    <line x1="0" y1="510" x2="1200" y2="510"/>
    <line x1="0" y1="570" x2="1200" y2="570"/>
  </g>

  <!-- Projection screen — back wall center -->
  <rect x="250" y="40" width="700" height="370" rx="4" fill="#0a1830"/>
  <rect x="250" y="40" width="700" height="370" rx="4" fill="none" stroke="#1a3050" stroke-width="2.5"/>
  <!-- Screen inner border -->
  <rect x="262" y="52" width="676" height="346" fill="#0c1e3a" opacity="0.8"/>

  <!-- Projection screen content: Enneagram 9-type circle -->
  <g transform="translate(600,225)" opacity="0.6">
    <!-- Outer circle -->
    <circle r="130" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.4"/>
    <!-- Inner hexagon connecting lines -->
    <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.25"/>
    <!-- 9 type nodes around circle -->
    <circle cx="0" cy="-130" r="8" fill="#0d1e34" stroke="#c9a227" stroke-width="1.2"/>
    <circle cx="85" cy="-100" r="8" fill="#0d1e34" stroke="#c9a227" stroke-width="1.2"/>
    <circle cx="124" cy="-30" r="8" fill="#0d1e34" stroke="#c9a227" stroke-width="1.2"/>
    <circle cx="110" cy="60" r="8" fill="#0d1e34" stroke="#c9a227" stroke-width="1.2"/>
    <circle cx="48" cy="120" r="8" fill="#0d1e34" stroke="#c9a227" stroke-width="1.2"/>
    <circle cx="-48" cy="120" r="8" fill="#0d1e34" stroke="#c9a227" stroke-width="1.2"/>
    <circle cx="-110" cy="60" r="8" fill="#0d1e34" stroke="#c9a227" stroke-width="1.2"/>
    <circle cx="-124" cy="-30" r="8" fill="#0d1e34" stroke="#c9a227" stroke-width="1.2"/>
    <circle cx="-85" cy="-100" r="8" fill="#0d1e34" stroke="#c9a227" stroke-width="1.2"/>
    <!-- Internal connections (selected paths) -->
    <g stroke="#c9a227" stroke-width="0.7" opacity="0.2" fill="none">
      <line x1="0" y1="-130" x2="110" y2="60"/>
      <line x1="0" y1="-130" x2="-110" y2="60"/>
      <line x1="85" y1="-100" x2="-48" y2="120"/>
      <line x1="-85" y1="-100" x2="48" y2="120"/>
      <line x1="124" y1="-30" x2="-124" y2="-30"/>
    </g>
    <!-- Center circle -->
    <circle r="30" fill="#0d1e34" stroke="#c9a227" stroke-width="1.2" opacity="0.7"/>
    <text y="5" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#c9a227" opacity="0.7" letter-spacing="1">9 Types</text>
  </g>

  <!-- Speaker / facilitator at front -->
  <g transform="translate(600,380)">
    <circle r="26" fill="#0e1e34"/>
    <!-- Gold collar accent -->
    <path d="M-8,22 L0,38 L8,22" fill="none" stroke="#c9a227" stroke-width="1.5" opacity="0.5"/>
    <ellipse cx="0" cy="64" rx="32" ry="45" fill="#0e1e34"/>
  </g>
  <!-- Podium -->
  <rect x="558" y="378" width="84" height="28" rx="3" fill="#0c1830"/>
  <rect x="562" y="406" width="76" height="18" rx="2" fill="#0a1428"/>

  <!-- Audience rows — tiered -->
  <!-- Row 1 (front, level 1) -->
  <g fill="#0c1828" opacity="0.75">
    <circle cx="200" cy="428" r="15"/><circle cx="248" cy="428" r="15"/><circle cx="296" cy="428" r="15"/>
    <circle cx="344" cy="428" r="15"/><circle cx="440" cy="428" r="15"/>
    <circle cx="760" cy="428" r="15"/><circle cx="856" cy="428" r="15"/>
    <circle cx="904" cy="428" r="15"/><circle cx="952" cy="428" r="15"/><circle cx="1000" cy="428" r="15"/>
  </g>
  <!-- Row 2 -->
  <g fill="#0c1828" opacity="0.65">
    <circle cx="160" cy="478" r="14"/><circle cx="210" cy="478" r="14"/><circle cx="260" cy="478" r="14"/>
    <circle cx="310" cy="478" r="14"/><circle cx="360" cy="478" r="14"/><circle cx="410" cy="478" r="14"/>
    <circle cx="460" cy="478" r="14"/><circle cx="510" cy="478" r="14"/>
    <circle cx="690" cy="478" r="14"/><circle cx="740" cy="478" r="14"/><circle cx="790" cy="478" r="14"/>
    <circle cx="840" cy="478" r="14"/><circle cx="890" cy="478" r="14"/><circle cx="940" cy="478" r="14"/>
    <circle cx="990" cy="478" r="14"/><circle cx="1040" cy="478" r="14"/>
  </g>
  <!-- Row 3 -->
  <g fill="#0c1828" opacity="0.55">
    <circle cx="120" cy="532" r="13"/><circle cx="170" cy="532" r="13"/><circle cx="220" cy="532" r="13"/>
    <circle cx="270" cy="532" r="13"/><circle cx="320" cy="532" r="13"/><circle cx="370" cy="532" r="13"/>
    <circle cx="420" cy="532" r="13"/><circle cx="470" cy="532" r="13"/><circle cx="520" cy="532" r="13"/>
    <circle cx="680" cy="532" r="13"/><circle cx="730" cy="532" r="13"/><circle cx="780" cy="532" r="13"/>
    <circle cx="830" cy="532" r="13"/><circle cx="880" cy="532" r="13"/><circle cx="930" cy="532" r="13"/>
    <circle cx="980" cy="532" r="13"/><circle cx="1030" cy="532" r="13"/><circle cx="1080" cy="532" r="13"/>
  </g>

  <!-- Growth / transformation spiral motif — right side floating -->
  <g transform="translate(980, 200)" opacity="0.4">
    <!-- Spiral as concentric arcs expanding -->
    <path d="M0,0 Q20,-35 40,0 Q60,35 20,60" fill="none" stroke="#c9a227" stroke-width="1.2"/>
    <path d="M-10,0 Q30,-65 70,0 Q110,65 30,110" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.7"/>
    <path d="M-25,-10 Q40,-100 105,0 Q165,100 40,165" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.5"/>
    <!-- Arrow on outermost -->
    <polygon points="40,165 28,152 52,148" fill="#c9a227" opacity="0.4"/>
  </g>

  <!-- Category pill -->
  <rect x="58" y="22" width="180" height="30" rx="15" fill="#c9a227" opacity="0.1"/>
  <rect x="58" y="22" width="180" height="30" rx="15" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.35"/>
  <text x="148" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#c9a227" opacity="0.8" letter-spacing="2">LEADERSHIP</text>

  <!-- Bottom bar -->
  <rect x="0" y="555" width="1200" height="75" fill="#070b11" opacity="0.9"/>
  <line x1="0" y1="555" x2="1200" y2="555" stroke="#c9a227" stroke-width="0.8" opacity="0.3"/>
  <text x="60" y="598" font-family="Georgia, serif" font-size="19" fill="#c9a227" opacity="0.8">Mindset Transformation · Enneagram · Organizational Change</text>
  <text x="1140" y="598" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#c9a227" opacity="0.45">Voice Dialogue · Satir</text>
</svg>
