<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1828"/>
      <stop offset="0.5" stop-color="#0e1e30"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="60%" r="40%">
      <stop offset="0" stop-color="#c9a227" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg4)"/>
  <rect width="1200" height="630" fill="url(#glow4)"/>

  <!-- Dusk sky gradient hint -->
  <rect x="0" y="0" width="1200" height="200" fill="#0d2040" opacity="0.3"/>

  <!-- Ground -->
  <rect x="0" y="520" width="1200" height="110" fill="#07101a"/>
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#152030" stroke-width="1"/>

  <!-- Thai military HQ building — center-left -->
  <g transform="translate(380,520)">
    <!-- Foundation -->
    <rect x="-260" y="-15" width="520" height="15" fill="#0c1a2c"/>
    <rect x="-240" y="-28" width="480" height="13" fill="#0e1e34"/>

    <!-- Main body -->
    <rect x="-220" y="-240" width="440" height="212" fill="#0d1e34"/>
    <!-- Columns facade -->
    <g fill="#0c1828">
      <rect x="-200" y="-240" width="14" height="212"/>
      <rect x="-168" y="-240" width="14" height="212"/>
      <rect x="-136" y="-240" width="14" height="212"/>
      <rect x="-104" y="-240" width="14" height="212"/>
      <rect x="-72"  y="-240" width="14" height="212"/>
      <rect x="58"   y="-240" width="14" height="212"/>
      <rect x="90"   y="-240" width="14" height="212"/>
      <rect x="122"  y="-240" width="14" height="212"/>
      <rect x="154"  y="-240" width="14" height="212"/>
      <rect x="186"  y="-240" width="14" height="212"/>
    </g>
    <!-- Windows lit -->
    <g fill="#c9a227" opacity="0.2">
      <rect x="-185" y="-220" width="24" height="36" rx="2"/>
      <rect x="-150" y="-220" width="24" height="36" rx="2"/>
      <rect x="-115" y="-220" width="24" height="36" rx="2"/>
      <rect x="-80"  y="-220" width="24" height="36" rx="2"/>
      <rect x="68"   y="-220" width="24" height="36" rx="2"/>
      <rect x="103"  y="-220" width="24" height="36" rx="2"/>
      <rect x="138"  y="-220" width="24" height="36" rx="2"/>
      <rect x="164"  y="-220" width="24" height="36" rx="2"/>
      <rect x="-185" y="-172" width="24" height="36" rx="2"/>
      <rect x="-115" y="-172" width="24" height="36" rx="2"/>
      <rect x="103"  y="-172" width="24" height="36" rx="2"/>
      <rect x="164"  y="-172" width="24" height="36" rx="2"/>
    </g>
    <!-- Roofline pediment -->
    <rect x="-225" y="-248" width="450" height="12" fill="#14304c"/>
    <polygon points="-225,-248 0,-295 225,-248" fill="#0d1e34"/>
    <polygon points="-205,-248 0,-280 205,-248" fill="#102540"/>
    <polyline points="-220,-248 0,-290 220,-248" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.25"/>
    <!-- Flag pole -->
    <line x1="0" y1="-295" x2="0" y2="-340" stroke="#c9a227" stroke-width="1.5" opacity="0.5"/>
    <polygon points="0,-340 22,-328 0,-316" fill="#c9a227" opacity="0.4"/>
    <!-- Main door -->
    <rect x="-30" y="-110" width="60" height="82" rx="4" fill="#080f1c"/>
    <path d="M-30,-108 Q0,-130 30,-108" fill="none" stroke="#14304c" stroke-width="2.5"/>
  </g>

  <!-- SECI Knowledge Model — right side -->
  <g transform="translate(820, 280)" opacity="0.7">
    <!-- 4 quadrant circle -->
    <circle r="160" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.2"/>
    <circle r="160" fill="#c9a227" opacity="0.02"/>
    <!-- Quadrant dividers -->
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#c9a227" stroke-width="0.8" opacity="0.3"/>
    <line x1="0" y1="-160" x2="0" y2="160" stroke="#c9a227" stroke-width="0.8" opacity="0.3"/>
    <!-- 4 quadrant labels + icons -->
    <!-- Socialization -->
    <circle cx="-80" cy="-80" r="50" fill="#0d1e34" stroke="#c9a227" stroke-width="1"/>
    <text x="-80" y="-92" text-anchor="middle" font-family="Georgia" font-size="18" fill="#c9a227" opacity="0.7">◉◉</text>
    <text x="-80" y="-68" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#c9a227" opacity="0.6" letter-spacing="1">Socialization</text>
    <!-- Externalization -->
    <circle cx="80" cy="-80" r="50" fill="#0d1e34" stroke="#c9a227" stroke-width="1"/>
    <text x="80" y="-92" text-anchor="middle" font-family="Georgia" font-size="18" fill="#c9a227" opacity="0.7">◉→</text>
    <text x="80" y="-68" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#c9a227" opacity="0.6" letter-spacing="1">Externalization</text>
    <!-- Internalization -->
    <circle cx="-80" cy="80" r="50" fill="#0d1e34" stroke="#c9a227" stroke-width="1"/>
    <text x="-80" y="68" text-anchor="middle" font-family="Georgia" font-size="18" fill="#c9a227" opacity="0.7">←◉</text>
    <text x="-80" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#c9a227" opacity="0.6" letter-spacing="1">Internalization</text>
    <!-- Combination -->
    <circle cx="80" cy="80" r="50" fill="#0d1e34" stroke="#c9a227" stroke-width="1"/>
    <text x="80" y="68" text-anchor="middle" font-family="Georgia" font-size="18" fill="#c9a227" opacity="0.7">⊕⊕</text>
    <text x="80" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#c9a227" opacity="0.6" letter-spacing="1">Combination</text>
    <!-- Rotating arrows between quadrants -->
    <path d="M-30,-140 Q80,-170 140,-30" fill="none" stroke="#c9a227" stroke-width="1.2" opacity="0.4" stroke-dasharray="5,4"/>
    <path d="M140,30 Q170,140 30,140" fill="none" stroke="#c9a227" stroke-width="1.2" opacity="0.4" stroke-dasharray="5,4"/>
    <path d="M-30,140 Q-170,80 -140,-30" fill="none" stroke="#c9a227" stroke-width="1.2" opacity="0.4" stroke-dasharray="5,4"/>
    <!-- SECI label -->
    <text x="0" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#c9a227" opacity="0.5" letter-spacing="2">SECI</text>
  </g>

  <!-- CQI cycle — small diagram top left area -->
  <g transform="translate(170, 200)" opacity="0.45">
    <circle r="70" fill="none" stroke="#c9a227" stroke-width="1"/>
    <!-- Plan-Do-Check-Act sectors -->
    <path d="M0,0 L0,-70 A70,70,0,0,1 70,0 Z" fill="#c9a227" opacity="0.06"/>
    <path d="M0,0 L70,0 A70,70,0,0,1 0,70 Z" fill="#c9a227" opacity="0.04"/>
    <path d="M0,0 L0,70 A70,70,0,0,1 -70,0 Z" fill="#c9a227" opacity="0.06"/>
    <path d="M0,0 L-70,0 A70,70,0,0,1 0,-70 Z" fill="#c9a227" opacity="0.04"/>
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#c9a227" stroke-width="0.8" opacity="0.3"/>
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#c9a227" stroke-width="0.8" opacity="0.3"/>
    <text x="35" y="-30" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#c9a227" opacity="0.7">Plan</text>
    <text x="35" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#c9a227" opacity="0.7">Do</text>
    <text x="-35" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#c9a227" opacity="0.7">Check</text>
    <text x="-35" y="-30" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#c9a227" opacity="0.7">Act</text>
    <text x="0" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#c9a227" opacity="0.5" letter-spacing="2">CQI</text>
  </g>

  <!-- Category pill -->
  <rect x="58" y="46" width="220" height="30" rx="15" fill="#c9a227" opacity="0.1"/>
  <rect x="58" y="46" width="220" height="30" rx="15" fill="none" stroke="#c9a227" stroke-width="0.8" opacity="0.35"/>
  <text x="168" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#c9a227" opacity="0.8" letter-spacing="2">KNOWLEDGE MANAGEMENT</text>

  <!-- Bottom bar -->
  <rect x="0" y="555" width="1200" height="75" fill="#070b11" opacity="0.9"/>
  <line x1="0" y1="555" x2="1200" y2="555" stroke="#c9a227" stroke-width="0.8" opacity="0.3"/>
  <text x="60" y="598" font-family="Georgia, serif" font-size="19" fill="#c9a227" opacity="0.8">KM &amp; CQI · Military Organizational Learning · SECI Model</text>
  <text x="1140" y="598" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#c9a227" opacity="0.45">PDCA · CQI</text>
</svg>
